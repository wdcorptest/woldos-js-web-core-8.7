<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Swiper</title>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
    <h1 class="header__text">
        РЕМОНТ ТЕХНИКИ РАЗЛИЧНЫХ БРЕНДОВ
    </h1>
</header>
<div class="swiper">
    <div class="swiper-wrapper">
        <div class="swiper-slide">
            <div class="swiper-slide__item-block">
                <img class="swiper-slide__logo-lenovo"
                src="./images/lenovo.svg">
                <a class="swiper-slide__link-lenovo"
                href="#">
                <img class="swiper-slide__link-image"
                src="./images/go.svg">
                </a>
            </div>
        </div>

        <div class="swiper-slide">
            <div class="swiper-slide__item-block">
                <img class="swiper-slide__logo-samsung"
                src="./images/samsung.svg">
                <a class="swiper-slide__link-samsung"
                href="#">
                <img class="swiper-slide__link-image"
                src="./images/go.svg">
                </a>
            </div>
        </div>

        <div class="swiper-slide">
            <div class="swiper-slide__item-block">
                <img class="swiper-slide__logo-apple"
                src="./images/apple.svg">
                <a class="swiper-slide__link-apple"
                href="#">
                <img class="swiper-slide__link-image"
                src="./images/go.svg">
                </a>
            </div>
        </div>

        <div class="swiper-slide">
            <div class="swiper-slide__item-block">
                <img class="swiper-slide__logo-bosch"
                src="./images/bosch.svg">
                <a class="swiper-slide__link-bosch"
                href="#">
                <img class="swiper-slide__link-image"
                src="./images/go.svg">
                </a>
            </div>
        </div>

        <div class="swiper-slide">
            <div class="swiper-slide__item-block">
                <img class="swiper-slide__logo-hp"
                src="./images/hp.svg">
                <a class="swiper-slide__link-hp"
                href="#">
                <img class="swiper-slide__link-image"
                src="./images/go.svg">
                </a>
            </div>
        </div>

        <div class="swiper-slide">
            <div class="swiper-slide__item-block">
                <img class="swiper-slide__logo-acer"
                src="./images/acer.svg">
                <a class="swiper-slide__link-acer"
                href="#">
                <img class="swiper-slide__link-image"
                src="./images/go.svg">
                </a>
            </div>
        </div>
    </div>
    <div class="swiper-pagination"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
